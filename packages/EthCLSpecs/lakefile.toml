name = "EthCLSpecs"
defaultTargets = ["EthCLSpecs"]

# Re-supply the system libcrypto flag (does not propagate across `require`); the
# blst / c-kzg archives propagate transitively from the LeanHazmat packages.
# The `-L` paths cover the common libdir layouts across platforms (Debian
# multiarch, `/usr/lib64` on Fedora/RHEL, and Homebrew's `opt` symlink on
# both macOS architectures); the linker ignores whichever are absent.
# `-lcrypto` (not `-l:libcrypto.so.3`) resolves via the unversioned symlink
# every platform's `-dev`/Homebrew package provides, so it works on both.
moreLinkArgs = ["-L/usr/lib/x86_64-linux-gnu", "-L/usr/lib64", "-L/opt/homebrew/opt/openssl@3/lib", "-L/usr/local/opt/openssl@3/lib", "-lcrypto"]
moreLeancArgs = ["-march=native"]

# The framework. Pulls in SizzLean (SSZ), LeanHazmatBls / LeanHazmatKzg (crypto)
# transitively.
[[require]]
name = "EthCLLib"
path = "../EthCLLib"

# The fork specs (EthCLSpecs.Fulu, EthCLSpecs.Gloas). Precompiled so the runner
# exe is native and `native_decide` self-tests find the FFI symbols.
[[lean_lib]]
name = "EthCLSpecs"
precompileModules = true

# The pyspec runner: a long-lived server instantiating the generic
# PySpecTests driver at a fork. Its root is a submodule of the precompiled lib,
# so it needs the interpreter shim to avoid a Lake build-graph cycle.
[[lean_exe]]
name = "pyspec_server"
root = "EthCLSpecs.PySpecTests.Server"
supportInterpreter = true

# Lean-internal spec self-tests (#guard over hand-built inputs). Sources under
# EthCLSpecs/Tests/ (namespace EthCLSpecs.Tests.*), excluded from the shipped lib.
[[lean_lib]]
name = "EthCLSpecsTests"
roots = ["EthCLSpecs.Tests"]

# The Stage 17d pass-2 container profile. Its root module imports both
# `EthCLSpecs` (for the real fork containers) and `SizzLeanBench.Runner`
# (for the TSV row shape), the one place the two bench surfaces meet.
# Precompiled for the same reason `SizzLeanBench` is: without it the
# sampling loops run as bytecode and the profile measures the interpreter.
[[lean_lib]]
name = "EthCLSpecsBench"
precompileModules = true

# The profile driver. Same `supportInterpreter` rationale as `pyspec_server`:
# its root is a submodule of a precompiled lib.
[[lean_exe]]
name = "specs_profile"
root = "EthCLSpecsBench.ProfileMain"
supportInterpreter = true

# The generator's spec half: fork bindings, state builders, seeds, and the
# generator files whose elaboration writes the records. Not precompiled. The
# output directory is fixed here so the command never depends on the working
# directory Lake gives it (ARCHITECTURE.md §2.3). The path is relative to the
# repository root, which is where Lake and the just recipes run; a per-package
# invocation writes under the subpackage instead. The `weak.` prefix defers
# the setting until the module that registers the option is imported, since
# the `lean` front end rejects a `-D` for an option it has not seen yet.
[[lean_lib]]
name = "EthCLSpecsTheoremVectors"
roots = ["EthCLSpecs.TheoremVectors"]
leanOptions = [{ name = "weak.theorem_vectors.outDir", value = "packages/EthCLSpecs/theorem_vectors" }]

# The command-line harness over the records: render, check, report. Its
# root builds under the exe's own configuration, so the `leanOptions` of
# the library above do not reach it; the exe takes the output path from
# the spec-half root's `outDir` constant instead of the option. The root
# sits in the un-precompiled library above, so it needs no
# `supportInterpreter` shim (ARCHITECTURE.md §2.3).
[[lean_exe]]
name = "theorem_vectors"
root = "EthCLSpecs.TheoremVectors.Main"
