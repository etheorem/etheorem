name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pyspec_limit:
        description: 'Per-suite case cap for the pyspec run (use "all" for the full sweep)'
        default: '1'
        required: false

# CI structure mirrors `just` — every step that has a corresponding
# Justfile recipe goes through `just <recipe>`, so local-dev and CI
# can't drift on what they actually run. Adding or renaming a recipe
# updates both sides at once. The only steps that don't go through
# `just` are toolchain installers (elan, uv, python, the `just`
# binary itself) and the `actions/cache` / `actions/upload-artifact`
# declarations, which are GitHub Actions concerns with no local-dev
# analogue.

jobs:
  lint:
    # Forbidden-token check on committed Lean source — no Lean
    # toolchain needed, just `git grep`. Runs in ~5 s. Two more checks
    # ride along: both read Lean sources as text, so they need no
    # toolchain either, and both catch the same class of rot that
    # `just lint` catches in the code. The citation check covers the
    # line spans the docs cite into the spec bodies; the constants
    # check covers each constant's tier and owning fork against the
    # pinned specs, from a vendored ground truth (no network).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - name: Lint Lean sources (sorry / #eval / #check / #print)
        run: just lint
      - name: Check the line-span citations into the spec bodies
        run: just check-citations
      - name: Check each spec constant's tier and owning fork
        run: just check-constants

  test:
    # In-Lean property tests: SHA-256 NIST CAVP vectors against both
    # the pure-Lean spec (LeanSha256) and the OpenSSL FFI shim
    # (LeanHazmatSha256), the FFI ≡ spec equivalence cross-checks, the
    # BLS / KZG KATs, the seven execution-layer family KATs (Keccak,
    # secp256k1, BN254, BLAKE2f, RIPEMD-160, modexp, P256VERIFY), SSZ
    # and SSZ library gates (Merkle PRNG, cache machinery on example
    # containers). All fire as `native_decide` examples via `lake build`.
    # The libraries themselves build transitively, so this job subsumes
    # the previous standalone build gate. The consensus-spec libraries
    # (EthCLLib / EthCLSpecs) have their own `ethcl` job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - name: Install nasm and the C++ toolchain
        # The runner is x86_64 Linux, where LeanHazmatSha256 assembles the
        # vendored ISA-L multi-buffer SHA-256 lanes with `nasm`. The image
        # does not ship it. `g++` compiles the vendored mcl for
        # LeanHazmatBn254 (the one C++ family; the build compiles the C++
        # runtime out, so no static libstdc++ is needed). Installed before
        # `doctor-native` so that check sees the real state.
        run: sudo apt-get install -y nasm g++
      - uses: actions/setup-go@v5
        with:
          # The `all` doctor profile probes `go`, and the runner image's
          # preinstalled Go is unpinned. Install the clients/prysm
          # module's own version first, so the probe sees a real,
          # pinned Go rather than whatever the image ships.
          go-version-file: clients/prysm/go.mod
          # The repo root has no go.mod, so setup-go's dependency-cache
          # step warns on every run, and this job builds no Go anyway.
          cache: false
      - name: Verify build-time native deps
        # The full `all` profile: this job builds every family, so the
        # execution-only checks (the RIPEMD-160 capability, the C++
        # compiler) apply here. See the `pyspec` job below for the
        # rationale.
        run: just doctor-native
      - name: Vendor native crypto sources
        # ISA-L crypto (LeanHazmatSha256, x86_64 Linux), blst
        # (LeanHazmatBls), c-kzg-4844 (LeanHazmatKzg), keccak-tiny
        # (LeanHazmatKeccak), libsecp256k1 (LeanHazmatSecp256k1), and
        # herumi/mcl (LeanHazmatBn254) are vendored upstream sources;
        # no system packages supply them. Fetch them at their pinned
        # tags / rev before the Lean build. Offline thereafter. `just test`
        # also self-vendors via the `hazmat-*-test` recipes; this explicit
        # step keeps the fetch visible and ordered first.
        run: just hazmat-sha256-vendor hazmat-bls-vendor hazmat-kzg-vendor hazmat-keccak-vendor hazmat-secp256k1-vendor hazmat-bn254-vendor
      # Pinned to the commit `v1` resolves to as of 2026-05-10. Bump deliberately.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: '.'
      - name: Unit tests
        run: just test

  pyspec:
    # ssz_generic acceptance: the fork-agnostic SSZ wire-format suite, run via
    # the SizzLean pytest harness + `ssz_generic_runner`. The dev-subset smoke
    # gate runs on every push / pull_request; `workflow_dispatch` with
    # `pyspec_limit: all` upgrades to the full sweep
    # (`just sizzlean-pyspec-full`). The per-fork ssz_static container
    # vectors run in the `ethcl` job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache consensus-spec-tests archives
        # Cache only the .tar.gz files (the `general` archive ssz_generic uses);
        # the extracted trees re-build on each run via `ensure_archive` in the
        # SizzLean harness, extraction is ~1 min, much cheaper than the
        # GitHub-side cache transfer would be. Keyed on the pinned tag; bumping
        # it invalidates and the cache repopulates on first run.
        uses: actions/cache@v4
        with:
          path: ~/.cache/sizzlean/v1.7.0-alpha.10-*.tar.gz
          key: consensus-spec-tests-v1.7.0-alpha.10-archives

      - name: Install nasm
        # See the `test` job.
        run: sudo apt-get install -y nasm
      - name: Verify build-time native deps
        # `just doctor-native consensus` probes cc + git + pkg-config +
        # libcrypto (the native deps the lakefiles consume via
        # `pkg-config --libs libcrypto`) plus `nasm` on x86_64 Linux,
        # and prints actionable platform install hints if anything is
        # missing. The `consensus` profile skips the execution-only
        # checks (the RIPEMD-160 capability, the C++ compiler): this
        # job's build never compiles those families. Runs *before*
        # lean-action so a missing OpenSSL surfaces here (~1 s) rather
        # than as a cryptic linker error 30 s into `lake build`. Uses
        # the `-native` variant (not full `just doctor`) because the
        # Lean toolchain isn't installed yet at this point; lean-action
        # does that next.
        run: just doctor-native consensus
      - name: Vendor native crypto sources
        # `ssz_generic_runner` links LeanHazmatSha256, which on this runner
        # builds the vendored ISA-L unit.
        run: just hazmat-sha256-vendor

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: '.'
          # Build the runner the ssz_generic harness drives; SizzLean and the
          # LeanHazmat FFI deps compile transitively.
          build-args: 'ssz_generic_runner'

      - name: Install Python dependencies
        run: just setup-python

      - name: Run ssz_generic pyspec suite
        run: |
          set -euo pipefail
          LIMIT='${{ github.event.inputs.pyspec_limit || '1' }}'
          if [ "$LIMIT" = "all" ]; then
            just sizzlean-pyspec-full
          else
            just sizzlean-pyspec-smoke
          fi

  ethcl:
    # EthCLLib (framework) + EthCLSpecs (Fulu / Gloas) acceptance. `just
    # ethcl-test` builds the shipped libs and their self-test libs, plus the
    # theorem-vector generator libraries and exe, firing the framework +
    # spec `#guard` / `native_decide` self-tests (inheritance replay, the crypto
    # seam, the running step, map-backing equivalence, the signing-root and
    # Merkle-branch primitives, the walking-skeleton discharge) and the
    # generator's build-time pins. Then the `pytest-xdist` pyspec smoke
    # gate runs the dev subset at minimal for
    # both forks through the per-worker `pyspec_server`. The consensus formats are
    # green for both forks (Fulu incl. PeerDAS data availability, standalone
    # execution_payload, and get_proposer_head; Gloas the full EIP-7732 ePBS spine,
    # operations, fork choice, and transition). The per-fork ssz_static container
    # vectors are collected too: the consensus containers pass, and the types
    # EthCLSpecs does not model (light-client, gossip, networking helpers) xfail.
    # Out of scope and not collected: Electra-parent Fulu fork/transition,
    # light_client, networking, merkle_proof, sync. Mainnet and the full sweep run
    # on demand (`--preset=mainnet`, `--subset=0`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache consensus-spec-tests archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/sizzlean/v1.7.0-alpha.10-*.tar.gz
          key: consensus-spec-tests-v1.7.0-alpha.10-archives
      - name: Install nasm
        run: sudo apt-get install -y nasm
      - name: Verify build-time native deps
        # The `consensus` profile: this job's build (pyspec_server →
        # EthCLSpecs → the consensus families) needs no RIPEMD-160
        # capability and no C++ compiler. See the `pyspec` job for the
        # rationale.
        run: just doctor-native consensus
      - name: Vendor native crypto sources
        run: just hazmat-sha256-vendor hazmat-bls-vendor hazmat-kzg-vendor
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: '.'
          # The runner exe; EthCLLib + EthCLSpecs compile transitively as deps.
          build-args: 'pyspec_server'
      - name: EthCL self-tests (lake build of the test libs)
        run: just ethcl-test
      - name: Proof-coverage ratchet (fork bodies + SSZ properties)
        # Reads the `.olean`s the build just produced: every `forkdef` is the
        # denominator, a theorem statement that mentions one is the touched
        # tier, a `@[characterizes f]` tag is the characterized tier. The step
        # also audits every theorem's axioms, which is where a committed
        # `sorryAx` dependency would surface. Costs seconds; it elaborates
        # nothing.
        #
        # It verifies and never writes. Four generated artifacts are compared
        # against the build, in both directions: the two baselines (one per
        # package) and the two README blocks (the repo rollup and the per-fork
        # tables). A lost proof turns the job red, and so does a new proof whose
        # author has not run `just proof-coverage-update` and committed the
        # bump. That diff is the coverage change, and it belongs in the pull
        # request under review rather than in a commit CI pushes behind the
        # author's back.
        run: just proof-coverage-check
      - name: Install Python dependencies
        run: just setup-python
      - name: EthCLSpecs pyspec smoke gate (minimal, both forks)
        run: just ethcl-pyspec-smoke

  poseidon:
    # Poseidon2 differential conformance against the HorizenLabs `zkhash`
    # Rust oracle (LeanPoseidon ARCHITECTURE.md §8). This is the ONLY job
    # that needs a Rust toolchain (cargo): it builds `poseidon_fuzz` (which
    # shells `cargo build` for the oracle) and runs it. The LeanPoseidon
    # core and its committed KATs build *without* Rust — the anchor KAT
    # already fires in the `test` job via `just test` (`poseidon-test`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@stable
      # Same lean-action pin as the other jobs. `build-args: poseidon_fuzz`
      # builds the exe, which triggers the `cargo build` + the Rust↔Lean
      # link; LeanPoseidon / LeanPoseidonTests compile transitively.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: '.'
          build-args: 'poseidon_fuzz'
      - name: Committed Poseidon2 KATs (native_decide, no Rust)
        run: just poseidon-vectors
      - name: Differential conformance vs the zkhash oracle
        run: just poseidon-fuzz

  poseidon-proofs:
    # The mathlib equivalence proof (`permute = permuteRef` — the shipped
    # fast layers equal the dense reference). This is the monorepo's ONLY
    # mathlib dependency, isolated in the standalone `LeanPoseidonProofs`
    # package — no other job (and not the umbrella build) touches mathlib.
    # `just poseidon-proofs` runs `lake exe cache get` (the `v4.29.1`
    # pin matches the repo toolchain, so prebuilt oleans are used — nothing
    # is compiled from scratch) then builds the proofs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      # `auto-config: false` → install the Lean toolchain only; the build +
      # mathlib-cache fetch go through the `just` recipe (CI mirrors `just`).
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
      - name: Build the fast≡reference equivalence proof (mathlib cache + build)
        run: just poseidon-proofs

  theorem-vectors:
    # Theorem-test-vector generation, end to end (THEOREM_VECTORS_ARCHITECTURE.md
    # §17.3). `needs: [ethcl]` places the job after the `ethcl` build, so a
    # build break surfaces there first. The recipe rebuilds everything it
    # needs: the two generator libraries, the exe, then render + check +
    # report. So the job needs no `build-args`. `auto-config: false` installs
    # the toolchain only; the recipe drives the build (the `poseidon-proofs`
    # job is the precedent). The native steps mirror the `ethcl` job's.
    # The generators link the same FFI families, and the
    # `consensus` doctor profile skips the execution-only probes. Hints stay
    # in the default `use` mode. A stale or failed hint does not fail the
    # job; the report lists it. A job that wants to catch unreviewed witness
    # churn would run with `THEOREM_VECTORS_HINTS=require` instead. The
    # output tree is gitignored, so the artifact is the only way to read a
    # run's vectors and report per commit.
    needs: [ethcl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - name: Install nasm
        # See the `ethcl` job.
        run: sudo apt-get install -y nasm
      - name: Verify build-time native deps
        # See the `ethcl` job.
        run: just doctor-native consensus
      - name: Vendor native crypto sources
        # See the `ethcl` job.
        run: just hazmat-sha256-vendor hazmat-bls-vendor hazmat-kzg-vendor
      # Pinned to the commit `v1` resolves to as of 2026-05-10. Bump deliberately.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: '.'
          auto-config: false
      - name: Generate the theorem vectors
        run: just theorem-vectors
      - name: Upload the vector output tree
        uses: actions/upload-artifact@v4
        with:
          name: theorem-vectors
          path: packages/EthCLSpecs/theorem_vectors/

  client-prysm:
    # Stage-10 client conformance (THEOREM_VECTORS_PLAN.md step 6): the
    # function-format vectors run against Prysm v7.2.1. `needs:
    # [theorem-vectors]` places the job after generation, and the job
    # downloads the output tree as an artifact instead of regenerating
    # it: the generator is the `theorem-vectors` job's full Lean build,
    # and the plan places this job after it. The upload in the
    # `theorem-vectors` job uses the directory as its path, so the
    # artifact root is that directory's contents; the download restores
    # them directly under `packages/EthCLSpecs/theorem_vectors/`, which
    # is the layout the harness walks
    # (`<outDir>/formats/function/<fork>/<preset>/`). The recipe runs
    # both preset builds. The failure rules are the plan's: a mismatch
    # fails the job, a tabled skip does not, and the harness's summary
    # appears in the log. Each build overwrites `client-results.json`. A
    # green run leaves the minimal build's file in the tree and uploads
    # nothing. A failed run uploads whichever file the last completed
    # build wrote, the mainnet answers when the mainnet build failed and
    # the minimal answers otherwise, so triage reads data, not only the
    # log. A harness-level failure (exit 2) writes no file itself, and
    # the upload ignores the miss.
    needs: [theorem-vectors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v5
        with:
          # The version comes from the module's own `go` line; the
          # doctor probe's 1.26.5 minimum is stated in the recipe.
          go-version-file: clients/prysm/go.mod
          # The repo root has no go.mod, so setup-go's dependency-cache
          # step warns on every run; the harness recipe redirects the
          # Go caches into the gitignored worktree.
          cache: false
      - name: Cache the Go module cache
        # The recipe points `GOMODCACHE` at `clients/prysm/.go/mod`, which
        # the worktree wipes between runs; without this step every run
        # re-downloads the full Prysm module set. Keyed on `go.sum`; a
        # `restore-keys` fallback reuses the older module set after a
        # dependency bump. The save runs in a post step gated on job
        # success, so a red run saves nothing and the next run
        # re-downloads the modules. Cache declarations are a GitHub
        # Actions concern with no local analogue; see the workflow header.
        uses: actions/cache@v4
        with:
          path: clients/prysm/.go/mod
          key: go-modcache-prysm-${{ hashFiles('clients/prysm/go.sum') }}
          restore-keys: |
            go-modcache-prysm-
      - name: Download the theorem-vector output tree
        uses: actions/download-artifact@v4
        with:
          name: theorem-vectors
          path: packages/EthCLSpecs/theorem_vectors
      - name: Run the Prysm client-conformance harness
        id: harness
        run: just client-prysm
      - name: Upload the client results
        # Only a failed harness step needs the artifact for triage; a
        # green run's answers live in the job log, one line per record
        # plus counts and skip reasons. An exit-2 harness-level failure
        # writes no results file; upload-artifact warns by default on
        # zero matched files, and `ignore` silences that warning in an
        # already-red job.
        if: failure() && steps.harness.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: client-prysm
          path: packages/EthCLSpecs/theorem_vectors/client-results.json
          if-no-files-found: ignore
